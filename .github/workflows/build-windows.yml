name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: python -m PyInstaller --noconfirm --distpath dist --workpath build packaging/pshomebrew-desk.spec
      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/PSHomebrewDesk/* -DestinationPath PSHomebrewDesk-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: PSHomebrewDesk-windows
          path: PSHomebrewDesk-windows.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PSHomebrewDesk-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
